name: Release

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v1.0.0, v0.1.0-beta, etc.

permissions:
  contents: write # Needed to create GitHub Releases and upload assets
  packages: write # Needed if publishing container images (optional)

jobs:
  release:
    name: GoReleaser Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full git history for changelogs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests before release
        run: go test ./... -race -timeout 60s

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
